name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # packageManager names pnpm, which is not installed yet at this step.
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0
      # contracts/ are byte copies of myriad-core files at contracts/core-revision.
      - run: sh scripts/check-contract-copies.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack --dry-run
