name: release

# Publishes the package to npm when a version tag (v1.2.3, v1.2.3-rc.1) is pushed, and on nothing else.
#
# build: checks that the tag may be published (the tagged commit is on main, package.json is not private, its
# version is not 0.0.0 and is the tag's), then lints, tests, builds and packs. It has no token and no OIDC.
# publish: takes only the packed tarball and publishes it, from the protected `npm` environment.
#
# Authentication: npm trusted publishing (OIDC) when the package has this workflow as its trusted publisher. A
# trusted publisher can only be set on a package that already exists, so the very first release authenticates with
# the `npm` environment's NPM_TOKEN secret (a granular, publish-only token); once the package exists, add the
# trusted publisher on npmjs.com and delete the secret. npm uses OIDC whenever it can, so nothing here changes.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      dist-tag: ${{ steps.check.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          # packageManager names pnpm, which is not installed yet at this step.
          package-manager-cache: false
      - name: The package is meant to be published, as the tagged version
        id: check
        run: |
          node -e '
            const pkg = require("./package.json")
            const fail = (why) => { console.error(why); process.exit(1) }
            if (pkg.private) fail("package.json is private: not publishing.")
            if (pkg.version === "0.0.0") fail("version 0.0.0 is not a release.")
            if (`v${pkg.version}` !== process.env.GITHUB_REF_NAME) fail(`tag ${process.env.GITHUB_REF_NAME} is not v${pkg.version}`)
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `dist-tag=${pkg.version.includes("-") ? "next" : "latest"}\n`)
          '
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # pnpm pack writes publishConfig's exports (dist/) into the packed package.json.
      - run: pnpm pack --out package.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package
          path: package.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      # Trusted publishing and npm provenance sign with this workflow's identity.
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: npm can publish with OIDC (11.5.1 or later)
        run: |
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"
      - run: npm publish ./package.tgz --provenance --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
